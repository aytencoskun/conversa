services:
  # 1. FastAPI Sunucusu
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: conversa-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - libretranslate

  # 2. Çeviri Motoru (LibreTranslate)
  libretranslate:
    image: libretranslate/libretranslate
    container_name: conversa-libretranslate
    environment:
      - LT_LOAD_ONLY=en,tr
    ports:
      - "5001:5000"
    volumes:
      - libretranslate_data:/home/libretranslate/.local

volumes:
  libretranslate_data:
